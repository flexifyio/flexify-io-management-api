openapi: 3.1.0
info:
  description: REST API for Flexify.IO Management Server
  title: Flexify.IO Management API
  version: 2.26.0-SNAPSHOT
servers:
- url: https://api.flexify.io
security:
- bearerAuth: []
paths:
  /account:
    get:
      description: Get your billing account summary
      operationId: getCurrentUserBillingAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingAccount"
          description: OK
        "400":
          description: Bad Request
      summary: Get account summary
      tags:
      - Billing Account
  /account/costs:
    get:
      description: Get list of costs on your billing account
      operationId: getCostsForCurrentUserBillingAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CostDetails"
          description: OK
        "400":
          description: Bad Request
      summary: Get costs
      tags:
      - Billing Account
  /account/payments:
    get:
      description: Get list of payments on your billing account
      operationId: getPaymentsForCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
          description: OK
        "400":
          description: Bad Request
      summary: Get payments
      tags:
      - Billing Account
  /cost/migration:
    post:
      operationId: estimateMigrationCost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMigrationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DtoMigrationCostEstimate"
          description: OK
        "400":
          description: Bad Request
      summary: Estimate migration cost
      tags:
      - Cost Estimates
  /endpoints:
    get:
      description: Get endpoints of current user. Optionally filters by name or identity
        using SQL LIKE syntax.
      operationId: getEndpointsForCurrentUser
      parameters:
      - in: query
        name: name
        required: false
        schema:
          type: string
      - in: query
        name: identity
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EndpointDetails"
                uniqueItems: true
          description: OK
        "400":
          description: Bad Request
      summary: Get all endpoints
      tags:
      - Endpoints
    post:
      operationId: createEndpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointSettings"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
          description: OK
        "400":
          description: Bad Request
      summary: Create endpoint
      tags:
      - Endpoints
  /endpoints/generated-access-keys:
    get:
      description: Generate new access keys pair
      operationId: generateAccessKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKeysPair"
          description: OK
        "400":
          description: Bad Request
      summary: Generate access keys
      tags:
      - Endpoints
  /endpoints/{endpoint-id}:
    delete:
      operationId: delete
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Delete the endpoint
      tags:
      - Endpoints
    get:
      operationId: getEndpointDetails
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointDetails"
          description: OK
        "400":
          description: Bad Request
      summary: Get endpoint details
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/actions/disable:
    put:
      operationId: disable
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Disable the endpoint
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/actions/enable:
    put:
      operationId: enableEndpoint
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Enable the endpoint
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/settings:
    put:
      description: Update attributes of the endpoint
      operationId: updateEndpointSettings
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointSettings"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Update endpoint
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/settings/secret-key:
    get:
      operationId: getEndpointSecretKey
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointSecretResponse"
          description: OK
        "400":
          description: Bad Request
      summary: Get endpoint secret key
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/storage-accounts:
    post:
      description: Attach storage accounts to the endpoint
      operationId: attachAccounts
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageAccountsRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Attach storage accounts
      tags:
      - Endpoints
    put:
      description: Modified all storage accounts to the endpoint
      operationId: changeAccounts
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageAccountsRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Replace storage accounts
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/storage-accounts/{storage-account-id}:
    delete:
      description: Detach storage account from the endpoint
      operationId: detachAccount
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: storage-account-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Detach storage account
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/storage-accounts/{storage-account-id}/settings:
    put:
      description: Modifies settings of the attached storage account
      operationId: setAttachedAccountSettings
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: storage-account-id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointStorageAccountSettings"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Update attached account settings
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/virtual-buckets:
    post:
      operationId: createVirtualBucket
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVirtualBucketRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Create virtual bucket
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/virtual-buckets/{virtual-bucket}:
    delete:
      operationId: deleteVirtualBucket
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: virtual-bucket
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Delete virtual bucket
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/virtual-buckets/{virtual-bucket}/buckets:
    post:
      description: Attach buckets to the virtual bucket
      operationId: attachBuckets
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: virtual-bucket
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualBucketStoragesRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Attach buckets
      tags:
      - Endpoints
    put:
      description: Replaces the list of buckets attached to the virtual bucket
      operationId: changeBuckets
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: virtual-bucket
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualBucketStoragesRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Replace attached buckets
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/virtual-buckets/{virtual-bucket}/buckets/{bucket-id}:
    delete:
      description: Detach bucket from the endpoint's virtual bucket
      operationId: detachBucket
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: virtual-bucket
        required: true
        schema:
          type: string
      - in: path
        name: bucket-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Detach bucket
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/virtual-buckets/{virtual-bucket}/buckets/{bucket-id}/settings:
    put:
      description: Modifies settings of the attached bucket
      operationId: setAttachedBucketSettings
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: virtual-bucket
        required: true
        schema:
          type: string
      - in: path
        name: bucket-id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualBucketStorageSettings"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Update attached bucket settings
      tags:
      - Endpoints
  /endpoints/{endpoint-id}/virtual-buckets/{virtual-bucket}/settings:
    put:
      description: Modifies virtual bucket configuration
      operationId: setVirtualBucketSettings
      parameters:
      - in: path
        name: endpoint-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: virtual-bucket
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualBucketSettings"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Update virtual bucket
      tags:
      - Endpoints
  /log:
    get:
      description: "Returns log entries of a storage account, storage, migration,\
        \ pipeline or endpoint."
      operationId: getLogForCurrentUser
      parameters:
      - in: query
        name: storage-account-id
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: storage-id
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: migration-id
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: pipeline-id
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: endpoint-id
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: marker
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkerPageLogEntry"
          description: OK
        "400":
          description: Bad Request
      summary: Get log entries
      tags:
      - Logs
  /migrations:
    get:
      description: Get all migrations for logged in user in paged mode
      operationId: getMigrations
      parameters:
      - description: Include hidden migrations to response
        in: query
        name: include-hidden
        required: false
        schema:
          type: boolean
          default: true
      - description: Only include active migrations to response
        in: query
        name: include-active-only
        required: false
        schema:
          type: boolean
          default: false
      - description: Include continuous migrations to response
        in: query
        name: include-continuous
        required: false
        schema:
          type: boolean
          default: false
      - description: "Only include migrations with specified pipeline id, use 'none'\
          \ to only include migrations without pipeline"
        in: query
        name: pipeline-id
        required: false
        schema:
          type: string
      - description: "Search across name, objectKeyFilter, keyRemovePrefix, and source/dest\
          \ buckets"
        in: query
        name: search
        required: false
        schema:
          type: string
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/OffsetOrPageReq"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMigration"
          description: OK
        "400":
          description: Bad Request
      summary: Get all migrations
      tags:
      - Migrations
    post:
      operationId: addMigration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMigrationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
          description: OK
        "400":
          description: Bad Request
      summary: Add new migration
      tags:
      - Migrations
  /migrations/actions/hide-all:
    post:
      description: Mark all unfinished migrations as hidden
      operationId: hideAllMigrations
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Hide all migrations
      tags:
      - Migrations
  /migrations/{migration-id}:
    get:
      description: Only the migration owner or an administrator has access to the
        migration.
      operationId: getMigration
      parameters:
      - in: path
        name: migration-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
          description: OK
        "400":
          description: Bad Request
      summary: Get migration by id
      tags:
      - Migrations
  /migrations/{migration-id}/actions/hide:
    post:
      description: Mark migration as hidden
      operationId: hideMigration
      parameters:
      - in: path
        name: migration-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Hide migration
      tags:
      - Migrations
  /migrations/{migration-id}/actions/stop:
    post:
      operationId: stopMigration
      parameters:
      - in: path
        name: migration-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Stop the migration
      tags:
      - Migrations
  /migrations/{migration-id}/mappings/{mapping-id}/slots/{slot}/actions/restart:
    post:
      operationId: restartSlot
      parameters:
      - in: path
        name: migration-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: mapping-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: slot
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Restart a slot
      tags:
      - Migrations
  /pipelines:
    get:
      description: Get all pipelines for the logged-in user
      operationId: getPipelinesForCurrentUser
      parameters:
      - description: "If true, returns short info (id, name, isContinuous)"
        in: query
        name: short
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncPipeline"
          description: "List of pipelines, either short (id, name, isContinues) or\
            \ full depending on request options."
        "400":
          description: Bad Request
      summary: List pipelines
      tags:
      - Replication Pipelines
    post:
      operationId: addPipeline
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSyncPipelineRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
          description: OK
        "400":
          description: Bad Request
      summary: Add new pipeline
      tags:
      - Replication Pipelines
  /pipelines/validate:
    post:
      description: Validate migration settings and mappings
      operationId: validateMigrationSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateMigrationSettingForPipelineRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Validate settings
      tags:
      - Replication Pipelines
  /pipelines/{pipeline-id}:
    delete:
      operationId: deletePipeline
      parameters:
      - in: path
        name: pipeline-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Delete the pipeline
      tags:
      - Replication Pipelines
    get:
      description: Only the pipeline owner or an administrator has access to the pipeline.
      operationId: getById
      parameters:
      - in: path
        name: pipeline-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPipeline"
          description: OK
        "400":
          description: Bad Request
      summary: Get pipeline by id
      tags:
      - Replication Pipelines
    patch:
      description: Edit existing replication pipeline
      operationId: patchPipeline
      parameters:
      - description: ID of the pipeline to edit
        in: path
        name: pipeline-id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSyncPipelineRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Edit pipeline
      tags:
      - Replication Pipelines
  /pipelines/{pipeline-id}/actions/pause:
    put:
      operationId: pause
      parameters:
      - in: path
        name: pipeline-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Pause the pipeline
      tags:
      - Replication Pipelines
  /pipelines/{pipeline-id}/actions/repair-notification-configs:
    put:
      description: Repair notification configs for continuous pipeline
      operationId: repairNotificationConfigs
      parameters:
      - in: path
        name: pipeline-id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationConfigSetupOptions"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Repair notification configs
      tags:
      - Replication Pipelines
  /pipelines/{pipeline-id}/actions/run-migration:
    put:
      description: Force run the migration in pipeline
      operationId: runMigration
      parameters:
      - in: path
        name: pipeline-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
          description: OK
        "400":
          description: Bad Request
      summary: Run migration
      tags:
      - Replication Pipelines
  /pipelines/{pipeline-id}/actions/unpause:
    put:
      operationId: unpause
      parameters:
      - in: path
        name: pipeline-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Unpause the pipeline
      tags:
      - Replication Pipelines
  /pipelines/{pipeline-id}/history:
    get:
      description: Only the pipeline owner or an administrator has access to the pipeline
        history. Stats for the current migration are not included.
      operationId: getPipelineHistoryByPipelineId
      parameters:
      - in: path
        name: pipeline-id
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/OffsetOrPageReq"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSyncPipelineHistoryEntry"
          description: OK
        "400":
          description: Bad Request
      summary: Get pipeline history
      tags:
      - Replication Pipelines
  /storage-accounts:
    get:
      description: Get all storage accounts for current user
      operationId: getStorageAccounts
      parameters:
      - description: Include storages of given storage account to the response
        in: query
        name: include-buckets
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageAccount"
                uniqueItems: true
          description: OK
        "400":
          description: Bad Request
      summary: List storage accounts
      tags:
      - Storage Accounts
    post:
      description: Add Storage Account with an optional list of buckets
      operationId: addStorageAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddStorageAccountRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
          description: Created
        "400":
          description: Bad Request
      summary: Add storage account
      tags:
      - Storage Accounts
  /storage-accounts/{storage-account-id}:
    delete:
      description: Hides the storage account and all its buckets/containers.
      operationId: deleteStorageAccount
      parameters:
      - in: path
        name: storage-account-id
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: force-detach
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Delete storage account
      tags:
      - Storage Accounts
    get:
      description: Get storage account by id
      operationId: getStorageAccount
      parameters:
      - in: path
        name: storage-account-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageAccountWithBuckets"
          description: OK
        "400":
          description: Bad Request
      summary: Get storage account
      tags:
      - Storage Accounts
  /storage-accounts/{storage-account-id}/actions/refresh:
    post:
      description: Requests the list of buckets/containers from the storage and updates
        it.
      operationId: refreshStorageAccount
      parameters:
      - in: path
        name: storage-account-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Refresh storage account
      tags:
      - Storage Accounts
  /storage-accounts/{storage-account-id}/buckets:
    post:
      description: Add buckets to the storage account
      operationId: addBuckets
      parameters:
      - in: path
        name: storage-account-id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBucketsRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdsList"
          description: Created
        "400":
          description: Bad Request
      summary: Add buckets
      tags:
      - Storage Accounts
  /storage-accounts/{storage-account-id}/buckets/{bucket-id}:
    delete:
      description: Deletes (hides) a bucket/container
      operationId: deleteBucket
      parameters:
      - in: path
        name: storage-account-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: bucket-id
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: force-detach
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Delete bucket
      tags:
      - Storage Accounts
    get:
      description: Get detailed stats for the bucket
      operationId: getBucket
      parameters:
      - in: path
        name: storage-account-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: bucket-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
          description: OK
        "400":
          description: Bad Request
      summary: Get bucket
      tags:
      - Storage Accounts
  /storage-accounts/{storage-account-id}/buckets/{bucket-id}/actions/refresh:
    post:
      description: Refresh statistics of a single bucket
      operationId: refreshBucket
      parameters:
      - in: path
        name: storage-account-id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: bucket-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
      summary: Refresh bucket
      tags:
      - Storage Accounts
  /storage-accounts/{storage-account-id}/settings:
    put:
      operationId: setStorageAccountSettings
      parameters:
      - in: path
        name: storage-account-id
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: verify
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageAccountSettings"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Update storage account settings
      tags:
      - Storage Accounts
  /user/current:
    get:
      description: Get details of user corresponding to provided auth token
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        "400":
          description: Bad Request
      summary: Get current user
      tags:
      - User Account
  /user/current/profile:
    put:
      operationId: updateCurrentUserProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfile"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Update user profile
      tags:
      - User Account
  /user/current/settings:
    put:
      operationId: updateCurrentUserSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettings"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Update user settings
      tags:
      - User Account
  /user/request-delete:
    post:
      description: Request current user deletion
      operationId: requestDelete
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Delete user account
      tags:
      - User Account
components:
  schemas:
    AccessKeysPair:
      type: object
      description: Access Keys Pair
      properties:
        accessKey:
          type: string
          description: Access Key
        secretKey:
          type: string
          description: Secret Key
    AddBucketsRequest:
      type: object
      properties:
        bucketNames:
          type: array
          items:
            type: string
          uniqueItems: true
        existingBucketRegion:
          type: string
        refresh:
          type: boolean
          description: "If set to true, we will start calculating statistics for the\
            \ buckets"
      required:
      - bucketNames
    AddMigrationRequest:
      type: object
      description: Start new migration request
      properties:
        mappings:
          type:
          - array
          - "null"
          description: Source storage to destination account/bucket mapping
          items:
            $ref: "#/components/schemas/AddMigrationRequestMapping"
        settings:
          $ref: "#/components/schemas/MigrationSettings"
          description: Migration settings
        verifyBuckets:
          type:
          - boolean
          - "null"
          deprecated: true
          description: "If buckets should be verified by HEAD request. Legacy field,\
            \ use settings.verifyBuckets instead. This field is deprecated and will\
            \ be removed in future versions."
    AddMigrationRequestMapping:
      type: object
      description: Mapping between source and destination buckets or containers
      properties:
        cdnUrl:
          type:
          - string
          - "null"
          description: CDN base URL for GET operations during migration
        customQueueId:
          type:
          - string
          - "null"
          description: Custom queue ID (ARN) for continuous pipelines
        destBucketName:
          type: string
          description: Name of source destination or container
        destBucketNewRegion:
          type:
          - string
          - "null"
          description: Region where the destination bucket will be created if it does
            not exist. null to use cloud's default region
        destStorageAccountId:
          type: integer
          format: int64
          description: ID of source destination account
        keyAddPrefix:
          type:
          - string
          - "null"
          description: Prefix to to be added to each key when migrating
        keyRemovePrefix:
          type:
          - string
          - "null"
          description: Prefix to to be removed from each key when migrating
        objectsListUri:
          type:
          - string
          - "null"
          description: A URI of a text file to take objects list from
        pipelineMappingId:
          type:
          - integer
          - "null"
          format: int64
          description: "ID of the pipeline mapping, in case of editing sync pipeline\
            \ setting"
        sourceBucketName:
          type: string
          description: Name of source bucket or container
        sourceStorageAccountId:
          type: integer
          format: int64
          description: ID of source storage account
      required:
      - destBucketName
      - destStorageAccountId
      - sourceBucketName
      - sourceStorageAccountId
    AddStorageAccountRequest:
      type: object
      properties:
        existingBucketRegion:
          type: string
          description: "Expected region when list of buckets is provided, optional"
          examples:
          - eu-gb
        includeBuckets:
          type: array
          description: "Lists of buckets to start monitoring, or null to request buckets\
            \ from the cloud"
          items:
            type: string
          uniqueItems: true
        refreshNow:
          type: boolean
          description: "If set to true, buckets will be refreshed after storage is\
            \ added"
        storageAccount:
          $ref: "#/components/schemas/NewStorageAccount"
          description: Storage account to create
        verify:
          type: boolean
          description: Specified if credentials or public access to included buckets
            should be checked
      required:
      - storageAccount
    AddSyncPipelineRequest:
      type: object
      description: Request body containing the updates for the replication pipeline
      properties:
        mappings:
          type:
          - array
          - "null"
          description: Source storage to destination account/bucket mapping
          items:
            $ref: "#/components/schemas/AddMigrationRequestMapping"
        name:
          type:
          - string
          - "null"
          description: Pipeline name
        notificationConfigSetupOptions:
          $ref: "#/components/schemas/NotificationConfigSetupOptions"
          description: Notification configuration setup options for continuous pipelines
        schedule:
          $ref: "#/components/schemas/SyncPipelineSchedule"
          description: Schedule
        settings:
          $ref: "#/components/schemas/MigrationSettings"
          description: Migration settings
        userNotificationSettings:
          $ref: "#/components/schemas/SyncPipelineNotificationSettings"
          description: User notification settings
        verifyBuckets:
          type:
          - boolean
          - "null"
          deprecated: true
          description: "If buckets should be verified by HEAD request. Legacy field,\
            \ use settings.verifyBuckets instead. This field is deprecated and will\
            \ be removed in future versions."
    BillingAccount:
      type: object
      description: Billing Account Information
      properties:
        adminState:
          type: string
          description: System Account state (Updated by Administrator)
          enum:
          - ACTIVE
          - SUSPENDED
          examples:
          - ACTIVE
        aggregateState:
          type: string
          description: Aggregated Account state (ACTIVE only if admin state and billing
            state are ACTIVE)
          enum:
          - ACTIVE
          - SUSPENDED
          examples:
          - ACTIVE
        billingState:
          type: string
          description: Billing Account state (Depend on balance and max credit)
          enum:
          - ACTIVE
          - SUSPENDED
          examples:
          - ACTIVE
        billingType:
          type: string
          description: Type of billing for this account
          enum:
          - INTEGRATED
          - BILLING_SERVER
        createdDate:
          type: string
          format: date-time
          description: Created Timestamp
        distributor:
          $ref: "#/components/schemas/Distributor"
          description: Distributor that manages this account
        id:
          type: integer
          format: int64
          description: Account Id
        maxCredit:
          $ref: "#/components/schemas/Money"
          description: Account Maximum Credit
        name:
          type: string
          description: Account Name
          examples:
          - Personal Account
        priceList:
          $ref: "#/components/schemas/PriceList"
          description: Price list (without prices)
    Bucket:
      type: object
      description: Storage bucket or container metadata
      properties:
        displayName:
          type: string
          description: Optional display name shown when provider name is not human-readable
          examples:
          - "USER: John Smith"
        hidden:
          type: boolean
          description: True if bucket record is soft-deleted
          readOnly: true
        id:
          type: integer
          format: int64
          description: Internal bucket record ID
          readOnly: true
        name:
          type: string
          description: Bucket/container/namespace name in cloud provider
          examples:
          - bucket-1
        refreshRequestedTime:
          type: string
          format: date-time
          description: Timestamp when refresh was last requested
        stat:
          $ref: "#/components/schemas/BucketStat"
          description: Calculated bucket statistics
          readOnly: true
    BucketStat:
      type: object
      description: Current statistics and refresh status of a bucket or container
      properties:
        bytes:
          type: integer
          format: int64
          description: Bytes in this bucket/container
        lastRefreshed:
          type: string
          format: date-time
          description: Last success refresh operation complete timestamp
        objects:
          type: integer
          format: int64
          description: Objects in this bucket/container
        region:
          type: string
          description: Region where this bucket is located
        state:
          type: string
          description: State of the bucket/container
          enum:
          - NONE
          - REFRESH_REQUESTED
          - REFRESHING
          - ERROR
          - WARNING
          - OK
          - AUTH_EXPIRED
          - AUTH_ERROR
    CleanupStat:
      type: object
      description: Statistics for destination cleanup operations
      properties:
        activeEngines:
          type: integer
          format: int64
          description: Number of engines that are busy with this
        activeStreams:
          type: integer
          format: int64
          description: Number of currently active streams
        bytesFailed:
          type: integer
          format: int64
        bytesNotMatchingPattern:
          type: integer
          format: int64
        bytesProcessed:
          type: integer
          format: int64
        bytesRemoved:
          type: integer
          format: int64
        bytesSkipped:
          type: integer
          format: int64
        finished:
          type: string
          format: date-time
          description: Finished time
        objectsFailed:
          type: integer
          format: int64
        objectsNotMatchingPattern:
          type: integer
          format: int64
        objectsProcessed:
          type: integer
          format: int64
        objectsRemoved:
          type: integer
          format: int64
        objectsSkipped:
          type: integer
          format: int64
        processingObjectsPerSecond:
          type: number
          format: double
          description: Objects/second processed
        removingObjectsPerSecond:
          type: number
          format: double
        retried:
          type: integer
          format: int64
          description: Number of retries
        started:
          type: string
          format: date-time
          description: Started time
        state:
          type: string
          description: State of migration on its part
          enum:
          - DEPLOYING
          - UNDEPLOYING
          - WAITING
          - STARTING
          - RESTARTING
          - IN_PROGRESS
          - STOPPING
          - SUCCEEDED
          - FAILED
          - STOPPED
          - NO_CONNECTION_TO_ENGINE
          - ENGINE_DELETED
          examples:
          - IN_PROGRESS
    CloudLocation:
      type: object
      description: Cloud location metadata for an engine or task
      properties:
        cloudCode:
          type: string
          description: Cloud code
          examples:
          - AWS
        netConfig:
          type: string
          description: Cloud network configuration name
          examples:
          - flexify-direct
        region:
          type: string
          description: Cloud region
          examples:
          - us-east-1
    CostDetails:
      type: object
      description: Cost Details
      properties:
        cost:
          $ref: "#/components/schemas/Money"
          description: Cost
        price:
          $ref: "#/components/schemas/Price"
          description: Price list entry used to calculate this cost
        usage:
          type: integer
          format: int64
          description: Usage in bytes
          examples:
          - 1073741824
        username:
          type: string
          description: Username
          examples:
          - scarecrow@wiz.oz
    CreateVirtualBucketRequest:
      type: object
      description: Request to create new virtual bucket
      properties:
        settings:
          $ref: "#/components/schemas/VirtualBucketSettings"
          description: Settings of the newly created virtual bucket
    Distributor:
      type: object
      description: Distributor or reseller partner
      properties:
        id:
          type: integer
          format: int64
          description: Id
        name:
          type: string
          description: Name of the distributor
          examples:
          - ACME
        payUrl:
          type: string
          description: URL where user should be redirected for payment
          examples:
          - https://example.com/pay
    DtoMappingCostEstimate:
      type: object
      description: Estimate cost of migration mapping
      properties:
        costs:
          type: array
          items:
            $ref: "#/components/schemas/DtoMappingCostEstimateEntry"
        mapping:
          $ref: "#/components/schemas/AddMigrationRequestMapping"
        totalCost:
          $ref: "#/components/schemas/Money"
        totalUsage:
          type: integer
          format: int64
    DtoMappingCostEstimateEntry:
      type: object
      properties:
        cost:
          $ref: "#/components/schemas/Money"
        destRegion:
          type: string
        engineLocation:
          $ref: "#/components/schemas/CloudLocation"
        enginesCount:
          type: integer
          format: int32
        price:
          $ref: "#/components/schemas/Price"
        sourceRegion:
          type: string
        usage:
          type: integer
          format: int64
        usageEstimationFailReason:
          type: string
          enum:
          - SOURCE_REFRESH_FAILED
          - SOURCE_STAT_STILL_CALCULATING
          - SOURCE_SIZE_NOT_KNOWN
          - SOURCE_FILTER
          - VARY
    DtoMigrationCostEstimate:
      type: object
      description: Estimate cost of migration
      properties:
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/DtoMappingCostEstimate"
        totalCost:
          $ref: "#/components/schemas/Money"
        totalUsage:
          type: integer
          format: int64
        usageEstimationFailReason:
          type: string
          enum:
          - SOURCE_REFRESH_FAILED
          - SOURCE_STAT_STILL_CALCULATING
          - SOURCE_SIZE_NOT_KNOWN
          - SOURCE_FILTER
          - VARY
    EndpointDetails:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/EndpointStorageAccount"
        credentialInKeyVault:
          type: boolean
          description: If credential is stored in Key Vault
          readOnly: true
        credentialKeyVaultSecretId:
          type: string
          description: Key Vault secret ID where this credential is stored (only for
            admins)
          readOnly: true
        id:
          type: integer
          format: int64
          description: Id
          readOnly: true
        ownerId:
          type: integer
          format: int64
        ownerUsername:
          type: string
        settings:
          $ref: "#/components/schemas/EndpointSettings"
          description: Settings of endpoint
        stat:
          $ref: "#/components/schemas/EndpointStat"
        virtualBuckets:
          type: array
          items:
            $ref: "#/components/schemas/VirtualBucket"
    EndpointHost:
      type: object
      properties:
        hostname:
          type: string
        httpEnabled:
          type: boolean
        httpPorts:
          type: array
          items:
            type: integer
            format: int32
          uniqueItems: true
        httpsEnabled:
          type: boolean
        httpsPorts:
          type: array
          items:
            type: integer
            format: int32
          uniqueItems: true
    EndpointSecretResponse:
      type: object
      properties:
        secretKey:
          type: string
    EndpointSettings:
      type: object
      description: Flexify IO Virtual Endpoint
      properties:
        credential:
          type: string
          description: Storage Credential (Secret Key)
          writeOnly: true
        identity:
          type: string
          description: Storage Identity (Access Key)
        name:
          type: string
          description: User-define name of the endpoint
        protocol:
          type: string
          description: Storage Protocol
          enum:
          - S3
          - AZURE
          - B2
          - DROPBOX
          - DROPBOX_TEAM
          examples:
          - S3
        selectionBreakTimeout:
          type: integer
          format: int64
          description: Timeout before canceling requests to non-responding clouds
            in FASTEST selection policy
          examples:
          - 300
        selectionPolicy:
          type: string
          description: Storage selection policy for GET/HEAD object requests
          enum:
          - NEWEST
          - FASTEST
          - PRIORITY
          examples:
          - NEWEST
        skipValidation:
          type: boolean
          description: Skip server-side validation for endpoint secret strength
          writeOnly: true
    EndpointStat:
      type: object
      properties:
        cloudDownloadBytes:
          type: integer
          format: int64
        cloudUploadBytes:
          type: integer
          format: int64
        errorEngines:
          type: integer
          format: int64
        health:
          type: string
          enum:
          - HEALTHY
          - WARNING
          - ERROR
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/EndpointHost"
        state:
          type: string
          enum:
          - ENABLING
          - ENABLED
          - ERROR
          - WARNING
          - NOT_ASSIGNED
          - DISABLING
          - DISABLED
          - UPDATING
          - DELETING
        stateUpdateRequested:
          type: boolean
        totalEngines:
          type: integer
          format: int64
        upToDateEngines:
          type: integer
          format: int64
        userDownloadBytes:
          type: integer
          format: int64
        userSpeedDownload:
          type: integer
          format: int64
        userSpeedUpload:
          type: integer
          format: int64
        userUploadBytes:
          type: integer
          format: int64
        warningEngines:
          type: integer
          format: int64
    EndpointStorageAccount:
      type: object
      description: Storage account attached to endpoint
      properties:
        settings:
          $ref: "#/components/schemas/EndpointStorageAccountSettings"
          description: Attached storage account configuration
        storageAccountId:
          type: integer
          format: int64
          description: Id of attached storage account
    EndpointStorageAccountSettings:
      type: object
      properties:
        createNewBucketsIn:
          type: string
          description: Region where new buckets will be created if not specified in
            request. Set to null to create new buckets in a default region.
        deleteObjects:
          type: boolean
          description: Delete data from this storage account
        putObjects:
          type: boolean
          description: Save new data to this storage account
    EnginesChoice:
      type: object
      properties:
        cloudCode:
          type: string
        count:
          type: integer
          format: int32
        engineConfigId:
          type: integer
          format: int64
        maxBytesPerSecond:
          type: integer
          format: int64
        maxRequestsPerSecond:
          type: integer
          format: int64
        netConfig:
          type: string
        region:
          type: string
        selectionMethod:
          type: string
          enum:
          - AUTO
          - SHARED
          - EXISTING
          - DEPLOYMENT
        streams:
          type: integer
          format: int32
    ErrorResponse:
      type: object
      properties:
        args:
          type: array
          items: {}
        message:
          type: string
    FinishOAuthParams:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        flow:
          type: string
          enum:
          - AUTH_CODE
          - DEVICE_CODE
        oauthProviderId:
          type: string
          enum:
          - MICROSOFT
          - GOOGLE
          - DROPBOX
          - DROPBOX_TEAM
      required:
      - code
      - flow
      - oauthProviderId
    IdResponse:
      type: object
      description: Created/Updated resource ID
      properties:
        id:
          type: integer
          format: int64
          description: Resource ID
    IdsList:
      type: object
      description: List of IDs
      properties:
        ids:
          type: array
          description: List of IDs
          items:
            type: integer
            format: int64
    LogEntry:
      type: object
      description: Log entry
      properties:
        endpointId:
          type: integer
          format: int64
          description: "Flexify endpoint related to this event, if any"
        engineUuid:
          type: string
          format: uuid
          description: Engine with which this endpoint is associated
        event:
          $ref: "#/components/schemas/LogEvent"
          description: Log event
        impersonatorEmail:
          type: string
          description: "Impersonator email, if action was done by impersonated user"
        impersonatorId:
          type: integer
          format: int64
          description: "Impersonator user id, if action was done by impersonated user"
        migrationId:
          type: integer
          format: int64
          description: "Migration related to this event, if any"
        pipelineId:
          type: integer
          format: int64
          description: "Replication pipeline related to this event, if any"
        storageAccountId:
          type: integer
          format: int64
          description: "Storage account related to this event, if any"
        storageId:
          type: integer
          format: int64
          description: "Storage related to this event, if any"
        taskUuid:
          type: string
          format: uuid
          description: "Task UUID related to this event, if any (NOT that the task\
            \ might be already deleted)"
    LogEvent:
      type: object
      description: Log event
      properties:
        level:
          type: string
          description: Level of the event
          enum:
          - INFO
          - WARNING
          - ERROR
        message:
          type: string
          description: Message of the event
        time:
          type: string
          format: date-time
          description: Time of the event
    Mapping:
      type: object
      properties:
        cdnUrl:
          type: string
          description: CDN base URL for GET operations during migration
        destBucket:
          $ref: "#/components/schemas/Bucket"
          description: Destination bucket/container
        destBucketNewRegion:
          type: string
          description: Region where bucket should be created if missing
        destStorageAccount:
