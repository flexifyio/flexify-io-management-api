          type: integer
          format: int64
          description: Minimum object size to preform multipart upload
          examples:
          - 1024
        minPartSize:
          type: integer
          format: int64
          description: Minimal part size for multipart upload
          examples:
          - 5242880
        minPartsNum:
          type: integer
          format: int32
          description: Minimum number of multipart upload parts
          examples:
          - 1
