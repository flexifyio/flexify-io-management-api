          type:
          - integer
          - "null"
          format: int32
          description: Maximum number of engines this migration uses (experimental)
          examples:
          - 1
        maxRequestsPerSecond:
          type:
          - integer
          - "null"
          format: int64
          description: Maximum migration throughout in requests per second
          examples:
          - 100
          exclusiveMinimum: 0
        maxRetries:
          type: integer
          format: int32
          description: Maximum number of retries
          examples:
          - 100
        maxRetriesForCopy:
          type: integer
          format: int32
          description: Maximum number of retries after copy started
          examples:
          - 10
        maxRetryTimeout:
          type: integer
          format: int32
          description: Maximum timeout between retries in seconds
          examples:
          - 5
        maxStreams:
          type:
          - integer
          - "null"
          format: int32
          description: Maximum streams that migration will use across all engines
          examples:
          - 16
        migrationMode:
          type: string
          description: Migration mode
          enum:
          - COPY
          - MOVE
          examples:
          - COPY
        migrationReportLevel:
          type:
          - string
          - "null"
          description: Migration report level
          enum:
          - ALL
          - NOT_SKIPPED
          - FAILED
          - NONE
        multipartConcurrency:
          type:
          - integer
          - "null"
          format: int32
          description: Maximum parts for parallel upload for a single object
          examples:
          - 16
        multipartLimit:
          type:
          - integer
          - "null"
          format: int64
          description: Minimum size in bytes for multipart upload
          examples:
          - 524288000
        multipartPartSize:
          type:
          - integer
          - "null"
          format: int64
          description: Part size for multipart upload
          examples:
          - 104857600
        name:
          type:
          - string
          - "null"
          description: Name of the migration
          examples:
          - Copy from source to destination
        objectKeyFilter:
          type:
          - string
          - "null"
          description: Migrate objects matching pattern
          examples:
          - '*'
        removeHeaders:
          type:
