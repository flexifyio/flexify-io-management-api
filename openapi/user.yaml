          - ALL
          - NOT_SKIPPED
          - FAILED
          - NONE
        pipelineMigrationLogLevel:
          type: string
          description: Override log level for pipeline migrations
          enum:
          - ERROR
          - WARNING
          - INFO
          - DEBUG
          - TRACE
        pipelineMigrationReportLevel:
          type: string
          description: Override migration report level for pipeline migrations
          enum:
          - ALL
          - NOT_SKIPPED
          - FAILED
          - NONE
    UserConfig:
      type: object
