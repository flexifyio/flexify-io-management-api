          - BULK
          - STANDARD
          - EXPEDITED
          examples:
          - BULK
        retryTimeout:
          type: integer
          format: int32
          description: Initial timeout between retries in seconds
          examples:
          - 5
        skipIfHashMatches:
          type: boolean
          description: Skip migration if source and destination object hash match.
