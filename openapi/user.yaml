          - "null"
          description: List of headers to remove during the migration
          items:
            type: string
        restoreDays:
          type:
          - integer
          - "null"
          format: int32
          description: Number of days to keep restored objects when automatically
            restoring objects from archival tier
          examples:
          - 7
        restoreMaxSize:
          type:
          - integer
          - "null"
          format: int64
          description: Maximum total size of objects to restore when automatically
            restoring objects from archival tier
          examples:
          - 1000000000
        restoreTier:
          type:
          - string
          - "null"
          description: Restore tier when automatically restoring objects from archival
