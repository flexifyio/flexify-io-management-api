        allowDropboxDestinations:
          type: integer
          format: int32
        allowRemovingConflictingBucketNotificationRules:
          type: integer
          format: int32
        maxActiveMigrations:
          type: integer
          format: int32
        maxAutoDeployEnginesCount:
          type: integer
          format: int32
        maxEndpoints:
          type: integer
          format: int32
        maxEnginesPerPipeline:
          type: integer
          format: int32
        maxMigrationCopyRetries:
          type: integer
          format: int32
        maxMigrationEngines:
          type: integer
          format: int32
        maxMigrationMappings:
          type: integer
          format: int32
        maxMigrationRamMb:
          type: integer
          format: int32
        maxMigrationRetries:
          type: integer
          format: int32
        maxMigrationSlots:
          type: integer
          format: int32
        maxMigrationStreamRamKb:
          type: integer
          format: int32
        maxMigrationStreams:
          type: integer
          format: int32
        maxMigrationsInQueue:
          type: integer
          format: int32
        maxNumberOfPipelines:
          type: integer
          format: int32
        maxPolicyRulesPerVirtualBucket:
          type: integer
          format: int32
        maxStorageAccountsPerEndpoint:
          type: integer
          format: int32
        maxStorages:
          type: integer
          format: int32
        maxStoragesPerVirtualBucket:
          type: integer
          format: int32
        maxVirtualBucketsPerEndpoint:
          type: integer
          format: int32
        skipAutoUndeploy:
          type: integer
          format: int32
        totpRecoveryCodesEnabled:
          type: integer
          format: int32
    UserProfile:
      type: object
      description: User's profile
      properties:
        city:
          type: string
          description: City
          examples:
          - Munchkin Village
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        company:
          type: string
          description: Company
          examples:
          - Wiz
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        country:
          type: string
          description: Country
          examples:
          - Munchkin Country
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        displayName:
          type: string
          description: Display name (usually first and last name)
          examples:
          - Scarecrow The Wiz
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        email:
          type: string
          description: "Email address, always matches the username"
          examples:
          - scarecrow@wiz.oz
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        phone:
          type: string
          description: Phone number
          examples:
          - "+1234567890"
          pattern: "^(?:[0-9\\+ ]{1,}\\(?[0-9]{3}\\)?[0-9\\- ]{4,12})?$"
        streetFirstLine:
          type: string
          description: Street address - first line
          examples:
          - Deadly Poppy Field
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        streetSecondLine:
          type: string
          description: Street address - second line
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        zip:
          type: string
          description: Zip code
          examples:
          - "17564"
          pattern: "^(?:[\\p{L}\\p{N}\\s\\-]{3,10})?$"
    UserSettings:
      type: object
      description: User's settings
      properties:
        allowPartnerManage:
          type: boolean
          description: Indicates that the user allowed his or her partner to impersonate
            and manage user's account
        sendNews:
          type: boolean
          description: Indicates tha the user agreed to receive news and updates
        sendNotifications:
          type: boolean
          description: Indicates that we should send system notifications to the user
    ValidateMigrationSettingForPipelineRequest:
      type: object
      description: Validate migration settings for pipeline request
      properties:
        continuous:
          type: boolean
          description: Indicates if the pipeline is continuous
        mappings:
          type: array
          description: Source storage to destination account/bucket mapping
          items:
            $ref: "#/components/schemas/AddMigrationRequestMapping"
        settings:
          $ref: "#/components/schemas/MigrationSettings"
          description: Migration settings
    VirtualBucket:
      type: object
      description: Flexify IO Virtual Bucket
      properties:
        settings:
          $ref: "#/components/schemas/VirtualBucketSettings"
          description: "Settings of the virtual bucket (name, etc.)"
        storages:
          type: array
          description: List of storages mapped to this virtual bucket
          items:
            $ref: "#/components/schemas/VirtualBucketStorage"
    VirtualBucketAccessPolicy:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"
    VirtualBucketSettings:
      type: object
      description: Settings of Virtual Bucket
      properties:
        accessPolicy:
          $ref: "#/components/schemas/VirtualBucketAccessPolicy"
          description: Virtual bucket access policy
        bucketName:
          type: string
          description: Virtual bucket name
          examples:
          - fl-demo
    VirtualBucketStorage:
      type: object
      description: Storage attached to virtual bucket
      properties:
        bucketId:
          type: integer
          format: int64
          description: ID of attached bucket
        settings:
          $ref: "#/components/schemas/VirtualBucketStorageSettings"
          description: Attached storage configuration
    VirtualBucketStorageSettings:
      type: object
      properties:
        deleteObjects:
          type: boolean
          description: Delete data from this storage
        putObjects:
          type: boolean
          description: Save new data to this storage
    VirtualBucketStoragesRequest:
      type: object
      description: Request to set or attach a number of storages to virtual bucket
      properties:
        newStorages:
          type: array
          description: A list of storages to set or accounts to virtual bucket
          items:
            $ref: "#/components/schemas/VirtualBucketStorage"
  securitySchemes:
    bearerAuth:
      description: "API token, sent as `Authorization: Bearer <token>`"
      scheme: bearer
      type: http
