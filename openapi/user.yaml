            \ to propagate deletions"
          enum:
          - KEEP
          - CLEAN
          examples:
          - KEEP
        lastModifiedFrom:
          type:
          - string
          - "null"
          format: date-time
          description: Migrate objects modified on or after specified date
          examples:
          - "1593080831081"
        lastModifiedTo:
          type:
          - string
          - "null"
          format: date-time
          description: Migrate objects modified before specified date
          examples:
          - "1593080831081"
