          examples:
          - s3.private.amazonaws.com
        privateEndpointPattern:
          type: string
          description: Endpoint pattern used by engines for specific region
          examples:
          - "s3.{region}.private.amazonaws.com"
        productName:
          type: string
          description: Name of product/region for this provider
          examples:
          - Blob Storage
        protocol:
          type: string
          description: Storage protocol this provider uses
          enum:
