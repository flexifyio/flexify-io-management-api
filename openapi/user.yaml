          description: User ID in the system
        isServiceAccount:
          type: boolean
          description: "Indicates that this the account is not intended for direct\
            \ sign-in, but it can be used via impersonation"
        microsoftOid:
          type: string
          description: Microsoft oid
        microsoftUserName:
          type: string
          description: Microsoft user name (email)
        org:
          $ref: "#/components/schemas/Org"
          description: Organization owning this user
        passwordIsEmpty:
          type: boolean
          description: Indicates that this user does not have a password
        profile:
          $ref: "#/components/schemas/UserProfile"
          description: User's profile
        recoveryCodesConfigured:
          type: boolean
          description: Indicates that active recovery codes exist for this user
        registered:
          type: string
          format: date-time
          description: Registration time
        roles:
          type: array
          description: Roles associated with this user
          items:
            type: string
            enum:
            - ROLE_USER
            - ROLE_ADMIN
            - ROLE_ACTUATOR
            - ROLE_DISTRIBUTOR
            - ROLE_PARTNER_ADMIN
            - ROLE_IMPERSONATOR
            - ROLE_BILLING
          uniqueItems: true
        settings:
          $ref: "#/components/schemas/UserSettings"
          description: User's settings
        signUpCode:
          type: string
          description: Sign up code that the user used when signing up
        state:
          type: string
          description: State of this user
          enum:
          - ACTIVE
          - DISABLED
          - DELETED
          examples:
          - ACTIVE
        termsAccepted:
          type: boolean
          description: Indicates if user has accepted terms. User must accept terms
            before using web console if requireLicense is configured for console.
            Does not restrict API access.
        totpRequired:
          type: boolean
          description: Indicates that password login currently requires a second factor
        userLimits:
          $ref: "#/components/schemas/UserConfig"
          description: Limits defined for this user
        username:
          type: string
          description: "Username, always the same as user's email"
          examples:
          - jsmith@example.com
    UserAdminManagedSettings:
      type: object
      description: "User's settings, managed by admin"
      properties:
        allowSelectingEnginesLocationForPipelines:
          type: boolean
          description: Allow user to select location for engines when creating/editing
            pipelines
        migrationLogLevel:
          type: string
          description: Override Log level for migrations
          enum:
