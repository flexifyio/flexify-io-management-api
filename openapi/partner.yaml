        activeContinuousPipelinesCount:
          type: integer
          format: int64
        activeMigrationsCount:
          type: integer
          format: int64
        activePipelinesCount:
          type: integer
          format: int64
        billingAccountAdminState:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        billingAccountName:
          type: string
        billingAccountState:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        company:
          type: string
        companyId:
          type: integer
          format: int64
        companyName:
          type: string
        deleteRequested:
          type: string
          format: date-time
        displayName:
          type: string
        distributorName:
          type: string
        email:
          type: string
        enabledEndpointsCount:
          type: integer
          format: int64
        externalId:
          type: string
        id:
          type: integer
          format: int64
        orgName:
          type: string
        priceListName:
          type: string
        registered:
          type: string
          format: date-time
        serviceAccount:
          type: boolean
        ssoOnly:
          type: boolean
        storageAccountsCount:
          type: integer
          format: int64
        totalEndpointsCount:
          type: integer
          format: int64
        totalMigrationsCount:
          type: integer
          format: int64
        totalPipelinesCount:
          type: integer
          format: int64
        totpConfigured:
          type: boolean
        userState:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - DELETED
  securitySchemes:
    bearerAuth:
      description: "API token, sent as `Authorization: Bearer <token>`"
      scheme: bearer
      type: http
