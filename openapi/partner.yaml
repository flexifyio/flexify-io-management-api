      summary: Delete user by username
      tags:
      - Partner Users
    get:
      description: Gets details of a user with given username
      operationId: getUserByUsername
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        "400":
          description: Bad Request
      summary: Get user details by username
      tags:
      - Partner Users
    put:
      description: Updates profile with a user with given username
      operationId: updateUserByUsername
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Update profile by username
      tags:
      - Partner Users
  /partner/users/username/{username}/actions/create-password-reset-token:
    post:
      operationId: createPasswordResetTokenByUsername
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetToken"
          description: OK
        "400":
          description: Bad Request
      summary: Create password reset token by username
      tags:
      - Partner Users
  /partner/users/username/{username}/actions/send-password-reset-email:
    post:
      description: Sends a user with given username password recovery email
      operationId: sendPasswordResetEmailByUsername
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Set/reset password by username
      tags:
