      description: Sends a user with given external ID password recovery email
      operationId: sendPasswordResetEmailByExternalId
      parameters:
      - in: path
        name: externalId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Set/reset password by external ID
      tags:
      - Partner Users
  /partner/users/external/{externalId}/limits:
    put:
      operationId: setLimitsByExternalId
      parameters:
      - in: path
        name: externalId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLimitsRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Set user limits by external ID
      tags:
      - Partner Users
  /partner/users/external/{externalId}/roles:
    put:
      operationId: setRolesByExternalId
      parameters:
      - in: path
        name: externalId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRolesRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Set user roles by external ID
      tags:
      - Partner Users
  /partner/users/external/{externalId}/settings:
    put:
      operationId: setSettingsByExternalId
      parameters:
      - in: path
        name: externalId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
