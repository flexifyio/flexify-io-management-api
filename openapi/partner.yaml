  /partner/users/username/{username}/admin-managed-settings/operational:
    put:
      operationId: setOperationalSettingsByUsername
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
