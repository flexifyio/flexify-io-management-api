      operationId: sendPasswordResetEmail
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Set/reset password
      tags:
      - Partner Users
  /partner/users/{userId}/admin-managed-settings/operational:
    put:
      operationId: setOperationalSettings
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserOperationalSettings"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: "Replace user's storage, migration and pipeline overrides by partner"
      tags:
      - Partner Users
  /partner/users/{userId}/limits:
    put:
      operationId: setLimits
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLimitsRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Set custom user limits by partner
      tags:
      - Partner Users
  /partner/users/{userId}/roles:
    put:
      operationId: setRoles
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRolesRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Set user roles
      tags:
      - Partner Users
  /partner/users/{userId}/state:
    put:
      description: Enables or disables a user with given ID
      operationId: changeUserState
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserStateRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Change user state
      tags:
      - Partner Users
  /partner/users/{userId}/tokens:
    post:
      description: Creates new API or integration token for a user with given ID
      operationId: generateToken
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTokenRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationToken"
          description: Created
        "400":
          description: Bad Request
      summary: Create token
      tags:
      - Partner Users
components:
  schemas:
    AddImpersonateCodeRequest:
      type: object
      properties:
        code:
          type: string
    AddImpersonateFromUserRequest:
      type: object
      properties:
        username:
          type: string
    AuthenticationToken:
      type: object
      description: Information about authentication token
      properties:
        comments:
          type: string
          description: Comments
        id:
          type: integer
          format: int64
          description: Unique token ID
        impersonator:
          type: string
          description: Impersonator
        ip:
          type: string
          description: IP address from which token was requested
        issued:
          type: string
          format: date-time
          description: When the token was issued
        lastUsed:
          type: string
          format: date-time
          description: When the token was last used
        token:
          type: string
          description: Token string used for Bearer auth
        tokenType:
          type: string
          description: Type of this token
          enum:
          - LOGIN
          - SSO_LOGIN
          - API
          - IMPERSONATION
          - INTEGRATION
    BillingAccount:
      type: object
      description: Billing Account Information
      properties:
        adminState:
          type: string
          description: System Account state (Updated by Administrator)
          enum:
          - ACTIVE
          - SUSPENDED
          examples:
          - ACTIVE
        aggregateState:
          type: string
          description: Aggregated Account state (ACTIVE only if admin state and billing
            state are ACTIVE)
          enum:
          - ACTIVE
          - SUSPENDED
          examples:
          - ACTIVE
        billingState:
          type: string
          description: Billing Account state (Depend on balance and max credit)
          enum:
          - ACTIVE
          - SUSPENDED
          examples:
          - ACTIVE
        billingType:
          type: string
          description: Type of billing for this account
          enum:
          - INTEGRATED
          - BILLING_SERVER
        createdDate:
          type: string
          format: date-time
          description: Created Timestamp
        distributor:
          $ref: "#/components/schemas/Distributor"
          description: Distributor that manages this account
        id:
          type: integer
          format: int64
          description: Account Id
        maxCredit:
          $ref: "#/components/schemas/Money"
          description: Account Maximum Credit
        name:
          type: string
          description: Account Name
          examples:
          - Personal Account
        priceList:
          $ref: "#/components/schemas/PriceList"
          description: Price list (without prices)
    Company:
      type: object
      description: "Company membership, independent of organization and billing account"
      properties:
        id:
          type: integer
          format: int64
          description: Company ID
        name:
          type: string
          description: Company name
          maxLength: 1024
          minLength: 0
        noCompany:
          type: boolean
          description: "The system company of users without a real company: always\
            \ exists, cannot be renamed"
          readOnly: true
        partnerAccessEnabled:
          type: boolean
          description: "The company lets the partner access its users' accounts (impersonate,\
            \ issue tokens, change the email), if a user allowed it too; changed in\
            \ the company settings"
          readOnly: true
      required:
      - name
    CompanyAuthenticationSettings:
      type: object
      description: "Sign-in and MFA settings of the company users; users may have\
        \ their own overrides, see UserAuthenticationSettings"
      properties:
        allowGoogleAuth:
          type: boolean
          description: Allow signing up and signing in with Google
        allowMicrosoftAuth:
          type: boolean
          description: Allow signing up and signing in with Microsoft
        allowOidcAuth:
          type: boolean
          description: Allow signing in with the company's OIDC provider
        allowPasswordAuth:
          type: boolean
          description: Allow signing up and signing in with password
        totpEnforced:
          type: boolean
          description: Require users with password auth to configure TOTP
        totpGracePeriodDays:
          type: integer
          format: int32
          description: "Number of days during which user can skip configuring required\
            \ TOTP, 0 - required immediately"
          minimum: 0
        totpRecoveryCodesEnabled:
          type: boolean
          description: Allow issuing and using TOTP recovery codes
      required:
      - allowGoogleAuth
      - allowMicrosoftAuth
      - allowOidcAuth
      - allowPasswordAuth
      - totpEnforced
      - totpGracePeriodDays
      - totpRecoveryCodesEnabled
    CreateUserRequest:
      type: object
