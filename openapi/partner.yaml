        profile:
          $ref: "#/components/schemas/UserProfile"
          description: Updated user profile data
    User:
      type: object
      description: Flexify IO user
      properties:
        account:
          $ref: "#/components/schemas/BillingAccount"
          description: Billing Account associated with this user
        actualAdminManagedSettings:
          $ref: "#/components/schemas/UserAdminManagedSettings"
          description: "Actual settings: authentication/MFA from user then company;\
            \ operational settings from user then partner then organization"
        actualLimits:
          $ref: "#/components/schemas/UserConfig"
          description: Actual limits thar are currently in force
        actualPermissions:
          $ref: "#/components/schemas/Permissions"
          description: Actual permissions of this user
          readOnly: true
        adminManagedSettings:
          $ref: "#/components/schemas/UserAdminManagedSettings"
          description: Admin-managed settings defined for this user
        billingServerAccountId:
          type: string
          description: ID of this user's billing account on an external billing server
        company:
          $ref: "#/components/schemas/Company"
          description: "Company membership, independent of organization and billing\
            \ account"
        companyAuthenticationSettings:
          $ref: "#/components/schemas/CompanyAuthenticationSettings"
          description: Authentication and MFA defaults of the user's company
        deleteRequested:
          type: string
          format: date-time
          description: If not null - time when the user requested to delete his or
            her account
        externalId:
          type: string
          description: "External ID of the user, if specified"
        googleSub:
          type: string
          description: Google subject
        googleUserName:
          type: string
          description: Google user name (email)
        id:
          type: integer
          format: int64
          description: User ID in the system
        impersonationKind:
          type: string
          description: "In /user/current only: who acts as the user, null if the user\
            \ signed in; otherwise by whose rights the user is impersonated"
          enum:
          - ADMIN
          - COMPANY_ADMIN
          - USER
          - PARTNER
        inheritedAdminManagedSettings:
          $ref: "#/components/schemas/UserAdminManagedSettings"
          description: "Inherited defaults: company authentication/MFA and partner/organization\
            \ operational settings"
        isServiceAccount:
          type: boolean
          description: "Indicates that this the account is not intended for direct\
            \ sign-in, but it can be used via impersonation"
        microsoftOid:
          type: string
          description: Microsoft oid
        microsoftUserName:
          type: string
          description: Microsoft user name (email)
        oidcProviderName:
          type: string
          description: "Name of OIDC provider of the user's company, null if the company\
            \ has not configured it"
        oidcSub:
          type: string
          description: Subject at OIDC provider of the user's company
        oidcUserName:
          type: string
          description: User name (email) at OIDC provider of the user's company
        org:
          $ref: "#/components/schemas/Org"
          description: Organization owning this user
        organizationAdminManagedSettings:
          $ref: "#/components/schemas/UserOperationalSettings"
          description: Operational defaults defined by user's organization
        partnerAdminManagedSettings:
          $ref: "#/components/schemas/UserOperationalSettings"
          description: "Operational defaults defined by user's partner, null if the\
            \ user has no partner"
        passwordIsEmpty:
          type: boolean
          description: Indicates that this user does not have a password
        pristine:
          type: boolean
          description: "Indicates that nobody has used the account yet: the user has\
            \ never signed in and no user the user allowed has impersonated the user.\
            \ With unset allowPartnerManage the partner may act as a pristine user\
            \ only"
        profile:
          $ref: "#/components/schemas/UserProfile"
          description: User's profile
        recoveryCodesConfigured:
          type: boolean
          description: Indicates that active recovery codes exist for this user
        registered:
          type: string
          format: date-time
          description: Registration time
        roles:
          type: array
          description: Roles associated with this user
          items:
            type: string
            enum:
            - ROLE_USER
            - ROLE_ADMIN
            - ROLE_ACTUATOR
            - ROLE_DISTRIBUTOR
            - ROLE_PARTNER_ADMIN
            - ROLE_COMPANY_ADMIN
            - ROLE_IMPERSONATOR
            - ROLE_BILLING
          uniqueItems: true
        settings:
          $ref: "#/components/schemas/UserSettings"
          description: User's settings
        signUpCode:
          type: string
          description: Sign up code that the user used when signing up
        state:
          type: string
          description: State of this user
          enum:
          - ACTIVE
          - DISABLED
          - DELETED
          examples:
          - ACTIVE
        termsAccepted:
          type: boolean
          description: Indicates if user has accepted terms. User must accept terms
            before using web console if requireLicense is configured for console.
            Does not restrict API access.
        totpConfigured:
          type: boolean
          description: "Indicates that the user has configured TOTP, so password sign\
            \ in requires a TOTP code"
        totpSetupDeadline:
          type: string
          format: date-time
          description: "Time until which the user can postpone configuring enforced\
            \ TOTP, null if the user does not have to configure TOTP"
        totpSetupRequired:
          type: boolean
          description: Indicates that the user has to configure TOTP because it is
            required by admin-managed settings for users with a password
        userLimits:
          $ref: "#/components/schemas/UserConfig"
          description: Limits defined for this user
        username:
          type: string
          description: "Username, always the same as user's email"
          examples:
          - jsmith@example.com
    UserAdminManagedSettings:
      type: object
      description: "Null means inherited: authentication/MFA user - company; operational\
        \ settings user - partner - organization"
      properties:
        authentication:
          $ref: "#/components/schemas/UserAuthenticationSettings"
          description: "Authentication and MFA settings, inherited from the user's\
            \ company when unset"
        operational:
          $ref: "#/components/schemas/UserOperationalSettings"
          description: "Operational settings, inherited from the user's partner then\
            \ organization when unset"
    UserAuthenticationSettings:
      type: object
      description: Authentication and MFA overrides; null fields inherit from the
        user's company
      properties:
        allowGoogleAuth:
          type: boolean
          description: Allow signing up and signing in with Google
        allowMicrosoftAuth:
          type: boolean
          description: Allow signing up and signing in with Microsoft
        allowOidcAuth:
          type: boolean
          description: Allow signing in with the company's OIDC provider
        allowPasswordAuth:
          type: boolean
          description: Allow signing up and signing in with password
        totpEnforced:
          type: boolean
          description: Require users with password auth to configure TOTP
        totpGracePeriodDays:
          type: integer
          format: int32
          description: "Number of days during which user can skip configuring required\
            \ TOTP, 0 - required immediately"
          minimum: 0
        totpRecoveryCodesEnabled:
          type: boolean
          description: Allow issuing and using TOTP recovery codes
    UserConfig:
      type: object
      properties:
        maxActiveMigrations:
          type: integer
          format: int32
        maxAutoDeployEnginesCount:
          type: integer
          format: int32
        maxEndpoints:
          type: integer
          format: int32
        maxEnginesPerPipeline:
          type: integer
          format: int32
        maxMigrationCopyRetries:
          type: integer
          format: int32
        maxMigrationEngines:
          type: integer
          format: int32
        maxMigrationMappings:
          type: integer
          format: int32
        maxMigrationRamMb:
          type: integer
          format: int32
        maxMigrationRetries:
          type: integer
          format: int32
        maxMigrationSlots:
          type: integer
          format: int32
        maxMigrationStreamRamKb:
          type: integer
          format: int32
        maxMigrationStreams:
          type: integer
          format: int32
        maxMigrationsInQueue:
          type: integer
          format: int32
        maxNumberOfPipelines:
          type: integer
          format: int32
        maxPolicyRulesPerVirtualBucket:
          type: integer
          format: int32
        maxStorageAccountsPerEndpoint:
          type: integer
          format: int32
        maxStorages:
          type: integer
          format: int32
        maxStoragesPerVirtualBucket:
          type: integer
          format: int32
        maxVirtualBucketsPerEndpoint:
          type: integer
          format: int32
    UserOperationalSettings:
      type: object
      description: "Operational settings: user - partner - organization; null fields\
        \ inherit from the next level"
      properties:
        allowAwsPrivateLinkInterface:
          type: boolean
          description: Allow AWS PrivateLink Interface Endpoint. Cannot be changed
            by partner
        allowDropboxDestinations:
          type: boolean
          description: Allow migrations to Dropbox. Cannot be changed by partner
        allowRemovingConflictingBucketNotificationRules:
          type: boolean
          description: Allow removing conflicting bucket notification rules when creating/editing
            continuous pipelines
        allowSelectingEnginesLocationForPipelines:
          type: boolean
          description: Allow user to select location for engines when creating/editing
            pipelines
        migrationLogLevel:
          type: string
          description: Log level for migrations. Null on organization level to use
            the level from engine configuration
          enum:
          - ERROR
          - WARNING
          - INFO
          - DEBUG
          - TRACE
        migrationReportLevel:
          type: string
          description: Migration report level for migrations. Null on organization
            level to use the level from engine configuration
          enum:
          - ALL
          - NOT_SKIPPED
          - FAILED
          - NONE
        pipelineMigrationLogLevel:
          type: string
          description: Log level for pipeline migrations. Null on organization level
            to use the level from engine configuration
          enum:
          - ERROR
          - WARNING
          - INFO
          - DEBUG
          - TRACE
        pipelineMigrationReportLevel:
          type: string
          description: Migration report level for pipeline migrations. Null on organization
            level to use the level from engine configuration
          enum:
          - ALL
          - NOT_SKIPPED
          - FAILED
          - NONE
        skipAutoUndeploy:
          type: boolean
          description: Skip auto undeploy of engines (only for debug). Cannot be changed
            by partner
    UserProfile:
      type: object
      description: User's profile
      properties:
        city:
          type: string
          description: City
          examples:
          - Munchkin Village
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        company:
          type: string
          description: Company
          examples:
          - Wiz
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        country:
          type: string
          description: Country
          examples:
          - Munchkin Country
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        displayName:
          type: string
          description: Display name (usually first and last name)
          examples:
          - Scarecrow The Wiz
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        email:
          type: string
          description: "Email address, always matches the username"
          examples:
          - scarecrow@wiz.oz
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        phone:
          type: string
          description: Phone number
          examples:
          - "+1234567890"
          pattern: "^(?:[0-9\\+ ]{1,}\\(?[0-9]{3}\\)?[0-9\\- ]{4,12})?$"
        streetFirstLine:
          type: string
          description: Street address - first line
          examples:
          - Deadly Poppy Field
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        streetSecondLine:
          type: string
          description: Street address - second line
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        zip:
          type: string
          description: Zip code
          examples:
          - "17564"
          pattern: "^(?:[\\p{L}\\p{N}\\s\\-]{3,10})?$"
    UserSettings:
      type: object
      description: User's settings
      properties:
        allowPartnerManage:
          type: boolean
          description: Indicates that the user allowed his or her partner to impersonate
            and manage user's account. Null when not decided yet; null in an update
            keeps the current value
        sendNews:
          type: boolean
          description: Indicates tha the user agreed to receive news and updates
        sendNotifications:
          type: boolean
          description: Indicates that we should send system notifications to the user
    UserStat:
      type: object
