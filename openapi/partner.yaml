    UserProfile:
      type: object
      description: User's profile
      properties:
        city:
          type: string
          description: City
          examples:
          - Munchkin Village
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        company:
          type: string
          description: Company
          examples:
          - Wiz
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        country:
          type: string
          description: Country
          examples:
          - Munchkin Country
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        displayName:
          type: string
          description: Display name (usually first and last name)
          examples:
          - Scarecrow The Wiz
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        email:
          type: string
          description: "Email address, always matches the username"
          examples:
          - scarecrow@wiz.oz
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        phone:
          type: string
          description: Phone number
          examples:
          - "+1234567890"
          pattern: "^(?:[0-9\\+ ]{1,}\\(?[0-9]{3}\\)?[0-9\\- ]{4,12})?$"
        streetFirstLine:
          type: string
          description: Street address - first line
          examples:
          - Deadly Poppy Field
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        streetSecondLine:
          type: string
          description: Street address - second line
          pattern: "^[\\p{L}\\p{N}\\s\\-.',&()#\\/\\[\\]@+_]*$"
        zip:
          type: string
          description: Zip code
          examples:
          - "17564"
          pattern: "^(?:[\\p{L}\\p{N}\\s\\-]{3,10})?$"
