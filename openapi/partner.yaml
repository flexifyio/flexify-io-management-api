components:
  schemas:
    AddImpersonateCodeRequest:
      type: object
      properties:
        code:
          type: string
    AddImpersonateFromUserRequest:
      type: object
      properties:
        username:
          type: string
    AuthenticationToken:
      type: object
      description: Information about authentication token
      properties:
        comments:
          type: string
          description: Comments
        id:
          type: integer
          format: int64
          description: Unique token ID
        impersonator:
          type: string
          description: Impersonator
        ip:
          type: string
          description: IP address from which token was requested
        issued:
          type: string
          format: date-time
          description: When the token was issued
        lastUsed:
          type: string
          format: date-time
          description: When the token was last used
        token:
          type: string
          description: Token string used for Bearer auth
        tokenType:
          type: string
          description: Type of this token
          enum:
          - LOGIN
          - SSO_LOGIN
          - API
          - IMPERSONATION
          - INTEGRATION
    BillingAccount:
      type: object
      description: Billing Account Information
      properties:
        adminState:
          type: string
          description: System Account state (Updated by Administrator)
          enum:
          - ACTIVE
          - SUSPENDED
          examples:
          - ACTIVE
        aggregateState:
          type: string
          description: Aggregated Account state (ACTIVE only if admin state and billing
            state are ACTIVE)
          enum:
          - ACTIVE
          - SUSPENDED
          examples:
          - ACTIVE
        billingState:
          type: string
          description: Billing Account state (Depend on balance and max credit)
          enum:
          - ACTIVE
          - SUSPENDED
          examples:
          - ACTIVE
        billingType:
          type: string
          description: Type of billing for this account
          enum:
          - INTEGRATED
          - BILLING_SERVER
        createdDate:
          type: string
          format: date-time
          description: Created Timestamp
        distributor:
          $ref: "#/components/schemas/Distributor"
          description: Distributor that manages this account
        id:
          type: integer
          format: int64
          description: Account Id
        maxCredit:
          $ref: "#/components/schemas/Money"
          description: Account Maximum Credit
        name:
          type: string
          description: Account Name
          examples:
          - Personal Account
        priceList:
          $ref: "#/components/schemas/PriceList"
          description: Price list (without prices)
    CreateUserRequest:
      type: object
      description: Profile and optional external ID of a user to be created
      properties:
        externalId:
          type: string
          description: An optional external ID that can be later used to reference
            this user
        orgId:
          type: integer
          format: int64
          description: ID of the organization to assign the user to (or default otherwise)
        priceListId:
          type: integer
          format: int64
          description: ID of the price list to assign to this user (or default otherwise)
        profile:
          $ref: "#/components/schemas/UserProfile"
