        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: "Replace user's storage, migration and pipeline overrides by partner"
      tags:
      - Partner Users
  /partner/users/username/{username}/limits:
    put:
      operationId: setLimitsByUsername
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLimitsRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Set user limits by username
      tags:
      - Partner Users
  /partner/users/username/{username}/roles:
    put:
      operationId: setRolesByUsername
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRolesRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Set user roles by username
      tags:
      - Partner Users
  /partner/users/username/{username}/state:
    put:
      description: Enables or disables a user with given username
      operationId: changeUserStateByUsername
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserStateRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Change user state by username
      tags:
      - Partner Users
  /partner/users/username/{username}/tokens:
    post:
      description: "Creates new API, impersonation or integration token for a user\
        \ with given username"
      operationId: generateTokenByUsername
      parameters:
      - in: path
        name: username
        required: true
