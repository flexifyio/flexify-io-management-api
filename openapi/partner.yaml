openapi: 3.1.0
info:
  description: REST API for Flexify.IO Management Server
  title: Flexify.IO Management API
  version: 2.26.0-SNAPSHOT
servers:
- url: https://api.flexify.io
security:
- bearerAuth: []
paths:
  /impersonate/as/{userId}:
    post:
      operationId: impersonate
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationToken"
          description: Created
        "400":
          description: Bad Request
      summary: Impersonate a user
      tags:
      - User Impersonation
  /impersonate/codes:
    get:
      operationId: getImpersonateCodesList
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                uniqueItems: true
          description: OK
        "400":
          description: Bad Request
      summary: Get impersonation codes of current user
      tags:
      - User Impersonation
    post:
      operationId: addImpersonateCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddImpersonateCodeRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Add impersonation code
      tags:
      - User Impersonation
  /impersonate/codes/{code}:
    delete:
      operationId: removeImpersonateCode
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Remove impersonation code
      tags:
      - User Impersonation
  /impersonate/from:
    get:
      operationId: getImpersonateFromList
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImpersonateUser"
                uniqueItems: true
          description: OK
        "400":
          description: Bad Request
      summary: Get users who can impersonate current user
      tags:
      - User Impersonation
    post:
      operationId: addImpersonateFromUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddImpersonateFromUserRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Allow a user to impersonate current user
      tags:
      - User Impersonation
  /impersonate/from/{user-id}:
    delete:
      operationId: removeImpersonateFromUser
      parameters:
      - in: path
        name: user-id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Stop a user from impersonating current user
      tags:
      - User Impersonation
  /impersonate/to:
    get:
      operationId: getImpersonateToList
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImpersonateUser"
                uniqueItems: true
          description: OK
        "400":
          description: Bad Request
      summary: Get users current user can impersonate
      tags:
      - User Impersonation
  /partner/codes:
    get:
      operationId: listSignupCodes
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignupCode"
                uniqueItems: true
          description: OK
        "400":
          description: Bad Request
      summary: Get all sign-up codes
      tags:
      - Partner Sign-Up Codes
    post:
      operationId: createCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupCode"
        required: true
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
      summary: Create sign-up code
      tags:
      - Partner Sign-Up Codes
  /partner/codes/{code}:
    delete:
      operationId: deleteCode
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Delete sign-up code
      tags:
      - Partner Sign-Up Codes
  /partner/organizations:
    get:
      operationId: listOrganizations
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Org"
          description: OK
        "400":
          description: Bad Request
      summary: List partner organizations
      tags:
      - Partner Organizations
  /partner/organizations/{orgId}/limits:
    get:
      operationId: getOrgLimits
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserConfig"
          description: OK
        "400":
          description: Bad Request
      summary: Get organization limits
      tags:
      - Partner Organizations
  /partner/users:
    get:
      description: Gets a list of all users managed by this distributor
      operationId: getUsers
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserStat"
          description: OK
        "400":
          description: Bad Request
      summary: Get all users
      tags:
      - Partner Users
    post:
      description: Creates a new user associated with this distributor
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
          description: Created
        "400":
          description: Bad Request
      summary: Create a user
      tags:
      - Partner Users
  /partner/users/external/{externalId}:
    delete:
      description: Deletes (marks as deleted) a user with given external ID
      operationId: deleteUserByExternalId
      parameters:
      - in: path
        name: externalId
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Delete user by external ID
      tags:
      - Partner Users
    get:
      description: Gets details of a user with given external ID
      operationId: getUserByExternalId
      parameters:
      - in: path
        name: externalId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        "400":
          description: Bad Request
      summary: Get user details by external ID
      tags:
      - Partner Users
    put:
      description: Updates profile with a user with given external ID
      operationId: updateUserByExternalId
      parameters:
      - in: path
        name: externalId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Update profile by external ID
      tags:
      - Partner Users
  /partner/users/external/{externalId}/actions/create-password-reset-token:
    post:
      operationId: createPasswordResetTokenByExternalId
      parameters:
      - in: path
        name: externalId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetToken"
          description: OK
        "400":
          description: Bad Request
      summary: Create password reset token by external ID
      tags:
